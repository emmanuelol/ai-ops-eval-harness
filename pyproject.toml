[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ops-eval-harness"
dynamic = ["version"]
description = "SRE-hardened QA scenario runner, LLM prompt/output assertions, and financial pipeline circuit breakers."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "pytz>=2023.3",
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
ai-ops-eval = "ai_ops_eval_harness.cli:main"

[tool.hatch.version]
path = "src/ai_ops_eval_harness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_ops_eval_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["ai_ops_eval_harness"]
branch = true

[tool.coverage.report]
show_missing = true

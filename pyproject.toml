[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ops-eval-harness"
dynamic = ["version"]
description = "SRE-hardened QA scenario runner, LLM prompt/output assertions, and financial pipeline circuit breakers."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "pytz>=2023.3",
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.hatch.version]
path = "src/ai_ops_eval_harness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_ops_eval_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

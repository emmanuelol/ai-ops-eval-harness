version: '3.8'

services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app/src
    command: ["pytest", "tests/", "-v"]

  audit:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["bash"]
    command: ["scripts/check_blacklist.sh"]

services:
  test:
    image: ai-ops-eval-harness:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/app/src
    command: ["tests/", "-v", "-o", "cache_dir=/tmp/.pytest_cache"]

  audit:
    image: ai-ops-eval-harness:latest
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["bash"]
    command: ["scripts/check_blacklist.sh", "."]
